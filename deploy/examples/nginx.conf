# deploy/examples/nginx.conf
#
# Reverse proxy for Mythgram with TLS and HTTP basic auth.
#
# Key points:
#   • proxy_buffering off + X-Accel-Buffering no: agent responses are SSE streams
#     and MUST NOT be buffered or they will appear to hang.
#   • long proxy_read_timeout: agent turns can run for minutes.
#   • proxy_set_header Connection "": keeps the upstream connection alive for SSE.
#
# Create the password file:  sudo htpasswd -c /etc/nginx/.htpasswd admin
#
# Then:  sudo nginx -t && sudo systemctl reload nginx

upstream mythgram_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    server_name mythgram.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mythgram.example.com;

    ssl_certificate     /etc/letsencrypt/live/mythgram.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mythgram.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Authenticate before reaching the (unauthenticated) backend.
    auth_basic "Mythgram";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 300m;   # prompt attachments (per-file limit is 300 MB)

    location / {
        proxy_pass http://mythgram_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Stream server-sent events without buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # Long-lived agent turns / SSE.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
