name: Build backend production

on:
  push:
    paths:
      - "mythgram/**"
      - ".github/workflows/backend-production.yml"
  pull_request:
    paths:
      - "mythgram/**"
      - ".github/workflows/backend-production.yml"

permissions:
  contents: read

concurrency:
  group: backend-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mythgram
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mythgram

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mythgram/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
