name: Build frontend production

on:
  push:
    paths:
      - "packages/frontend-main/**"
      - ".github/workflows/frontend-production.yml"
  pull_request:
    paths:
      - "packages/frontend-main/**"
      - ".github/workflows/frontend-production.yml"

permissions:
  contents: read

concurrency:
  group: frontend-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend-main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend-main

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/frontend-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
