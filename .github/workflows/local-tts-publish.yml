name: local-tts publish

# Publishes the `local-tts` package on every v* tag via two install methods:
#
#   1. PyPI      (already published — pip install local-tts-studio)
#   2. Docker    (container job: builds the local-tts OCI image and pushes it to
#                 ghcr.io/mythgram-ai/local-tts, which is where the package
#                 appears in the repository's "Packages" section:
#                 docker run -p 7878:7878 -v local-tts-data:/data \
#                   ghcr.io/mythgram-ai/local-tts:latest)
#
# This workflow deliberately does NOT create a GitHub Release. Only the OCI
# image is published on a tag.
#
# workflow_dispatch (manual run) publishes only the container, from main.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # Read-only repository contents: this workflow must never create a release.
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/local-tts
          tags: |
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=branch,enable=${{ github.ref_type == 'branch' }}

      - uses: docker/build-push-action@v6
        with:
          context: packages/local-tts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
