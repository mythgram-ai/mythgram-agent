[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-tts-studio"
version = "1.0.0"
description = "Local Piper text-to-speech studio: single-port web UI + REST + OpenAI-compatible speech API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mythgram" }]
keywords = ["tts", "speech", "piper", "voice", "openai", "audio", "local"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "psutil>=6.1",
]

[project.scripts]
local-tts = "local_tts.cli:main"

[project.urls]
Homepage = "https://github.com/mythgram-ai/mythgram-agent/tree/main/packages/local-tts"
Issues = "https://github.com/mythgram-ai/mythgram-agent/issues"

[project.optional-dependencies]
cuda = ["onnxruntime-gpu"]

[tool.hatch.build.targets.wheel]
packages = ["local_tts"]
